language: python
sudo: false
python:
  - "3.7"
  - "3.8"
  - "3.9"
  - "pypy3"
env:
  - DJANGO=2.2
  - DJANGO=3.0
  - DJANGO=master
matrix:
    include:
    - { python: "3.9", env: TOXENV=flake8 }
    - { python: "3.9", env: TOXENV=apicheck }
    - { python: "3.9", env: TOXENV=cov }

    allow_failures:
    - python:
      - "pypy3"
    - env: DJANGO=master
cache:
  directories:
    - $HOME/.cache/pip
install: pip install tox-travis
script: tox
